[package]
name = "ats5"
description = "Automatic acceptance and tabulation system for amateur-radio contests."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ats5-core.workspace = true
ats5-wasm.workspace = true
rxsl.workspace = true
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie-signed"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
quick-xml = "0.41"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
oxc = { version = "0.157", features = ["transformer", "codegen", "semantic"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
