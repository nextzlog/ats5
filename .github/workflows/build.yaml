name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y -p typescript@5.6.3 tsc -p apps/ats5/web
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          TZ: Asia/Tokyo

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: ats5-linux-x86_64
            file: ats5
          - os: macos-latest
            name: ats5-macos-aarch64
            file: ats5
          - os: windows-latest
            name: ats5-windows-x86_64.exe
            file: ats5.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release -p ats5
      - run: mv target/release/${{ matrix.file }} ${{ matrix.name }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          prerelease: true
          files: ats5-*
